name: Keep Streamlit awake

on:
  schedule:
    - cron: "17 */4 * * *"   # every 4 h (UTC); off the hour to dodge GitHub's busy :00 slot
  workflow_dispatch:          # "Run workflow" button for a manual test

jobs:
  wake:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install playwright==1.47.0 && python -m playwright install --with-deps chromium
      - run: python scripts/wake.py
        env:
          APP_URLS: ${{ vars.APP_URLS }}
